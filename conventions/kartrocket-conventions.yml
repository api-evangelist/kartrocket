idempotency:
  supported: false
  notes: >-
    Shiprocket does not document a client-supplied idempotency-key header. Order
    creation is deduplicated server-side on the seller's own `order_id`
    (source order id), not via an Idempotency-Key contract. No `type: Idempotency`
    pointer is emitted (no idempotency contract to advertise).
error_envelope:
  shape: json
  notes: >-
    Errors return a JSON body with `message` (and often field-level validation
    messages) alongside a non-2xx HTTP status. No RFC 9457 problem+json.
rate_limiting:
  documented: false
  notes: Rate limits are enforced but not published as a documented signal.
