aid: kartrocket
name: KartRocket
description: >-
  KartRocket is the original brand of what is now Shiprocket, India's leading
  eCommerce enablement and shipping-logistics platform (operated by BigFoot Retail
  Solutions Pvt Ltd). Shiprocket helps D2C brands, SMEs, and enterprise sellers
  manage eCommerce shipping, last-mile delivery, reverse logistics, freight,
  hyperlocal delivery, cross-border shipping, warehouse fulfillment, and seller
  analytics from one platform — delivering to 19,000+ pin codes in India and 220+
  countries. The public Shiprocket API (apiv2.shiprocket.in/v1/external) lets
  sellers rate-shop couriers, create and cancel orders, generate AWBs and labels,
  schedule pickups, and track shipments; an official MCP server and agentic UI
  component library extend it to AI agents. Backed by 500 Global.
